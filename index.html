<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Card</title>
  
  <link rel="stylesheet" href="assets/css/style.css">
  
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>

  
  <div class="wrapper">
    
    
    <div class="product-card">
      <div class="card-top">
        <img class="card-top__image" src="assets/image/png/neeed.png" alt="Course image" />
        <span class="card-top__sale">Распродажа</span>
        <div class="icon-buttons">
          <div class="icon-button icon-button_heart"></div>
          <div class="icon-button icon-button_cart"></div>
          <div class="icon-button icon-button_eye"></div>
        </div>
      </div>
      <div class="product-card__content">
        <div class="product-card__header">
          <span class="product-card__department">Усулги по уборке</span>
          <span class="rating">3.9</span>
        </div>
        <div class="product-card__name">
          Убокра офисофф
        </div>
        <div class="regular-text">
          Нужна уброка, а ваша уборщисят уволилса
          Сделаем бытро, чисто, без вопросов.
          С вызвовм прям в офис
        </div>
        <div class="product-card__sales">
          <span>3 Заказа</span>
        </div>
        <div class="product-card__prices">
          <span class="product-card__price product-card__price_disabled">1250₽</span>
          <span class="product-card__price">999,99₽</span>
        </div>
        <div class="product-card__info">
          <div class="product-card__info-item product-card__info-item_icon_clock">
            Выезд за 30 мин
          </div>
          <div class="product-card__info-item product-card__info-item_icon_lessons">
            Опыт 5 лет
          </div>
          <div class="product-card__info-item product-card__info-item_icon_progress">
            Гарантия
          </div>
        </div>
        <button class="button button_type_icon button_type_outline">
          Заказать
          <svg width="10" height="16" viewBox="0 0 10 16" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M0 13.7143L5.71428 8L0 2.28571L1.14286 0L9.14286 8L1.14286 16L0 13.7143Z" fill="currentColor"/>
          </svg>
        </button>
      </div>
    </div>

  </div>
</body>
</html>
